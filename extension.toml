id = "mermaid-preview"
name = "Mermaid Preview"
description = "Render Mermaid diagrams from Markdown or .mmd files"
version = "0.1.24"
schema_version = 1
authors = ["Mermaid Preview Maintainers"]
repository = "https://github.com/dawsh2/zed-mermaid-preview"
languages = ["languages/mermaid"]
themes = []
icon_themes = []
capabilities = []

[lib]
kind = "Rust"
version = "0.7.0"

[compatibility]
zed = "0.210.0"

# Language server for Mermaid rendering
[language_servers.mermaid]
name = "Mermaid LSP"
languages = ["Markdown", "Mermaid"]

[language_servers.mermaid.language_ids]
"Markdown" = "markdown"
"Mermaid" = "mermaid"

[grammars.mermaid]
repository = "https://github.com/monaqa/tree-sitter-mermaid"
rev = "90ae195b31933ceb9d079abfa8a3ad0a36fee4cc"
